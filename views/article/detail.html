<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{.Article.Title}} - 我的博客</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 800px;
            margin: 40px auto;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.8;
            padding: 20px;
        }

        header {
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            margin: 0;
        }

        .meta {
            color: #888;
            font-size: 14px;
            margin-top: 8px;
        }

        .content {
            margin-top: 25px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            word-break: break-word;
        }

        a.back {
            display: inline-block;
            margin-top: 30px;
            color: #007BFF;
            text-decoration: none;
        }
        a.back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{.Article.Title}}</h1>
        <div class="meta">
            作者：{{.Article.Author}}  
            | 发布日期：{{.Article.CreateTime}}  
            | 浏览量：{{.Article.Id}}
        </div>
    </header>

    <article class="content">
        {{.Article.Content}}
    </article>
    <ul>
        {{if .IsLogin}}
        <!-- <a class="nav-link" href="/article/update?id={{.Article.Id}}">修改文章</a> -->
        <li class="nav-item"><button id="update-btn" data-id="{{.Article.Id}}">修改文章</button></li>
        <li class="nav-item"><button id="delete-btn" data-id="{{.Article.Id}}">删除文章</button></li>
        {{end}}
    </ul>


   

    <a href="/article/list" class="back">← 返回首页</a>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    const updateBtn = document.getElementById("update-btn");
    if(updateBtn) {
        updateBtn.addEventListener("click", function() {
            if(!confirm("确定要修改这篇文章吗？")) return;

            const articleId = this.getAttribute("data-id");

            fetch(`/article/update?id=${articleId}`, {
                method: "GET"
            })
            .then(res => res.json())
            .then(data => {
                if(data.code === 1){
                    alert("修改成功！");
                    window.location.href = "/article/list";
                } else {
                    alert("修改失败：" + data.msg);
                }
            });
        });
    }

    </script>

    <script>
    const deleteBtn = document.getElementById("delete-btn");
    if(deleteBtn) {
        deleteBtn.addEventListener("click", function() {
            if(!confirm("确定要删除这篇文章吗？")) return;

            const articleId = this.getAttribute("data-id");

            fetch(`/article/delete?id=${articleId}`, {
                method: "POST"
            })
            .then(res => res.json())
            .then(data => {
                if(data.code === 1){
                    alert("删除成功！");
                    window.location.href = "/article/list";
                } else {
                    alert("删除失败：" + data.msg);
                }
            });
        });
    }

    </script>

</body>



</html>
